[package]
name = "oa2is_oil_engine"
version = "0.4.1"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
salva3d = { path = "../build/salva/build/salva3d", default-features = false, features = ["dim3", "f32"] }
nalgebra = "0.35"
rayon = { version = "=1.11.0", optional = true }

[features]
native-parallel = ["salva3d/parallel", "rayon"]

[[bin]]
name = "oa2is_oil_native"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

